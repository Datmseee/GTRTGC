# Mosquitto config for the SPLRT demo.
# Mosquitto 2.x only accepts connections from the laptop itself unless told otherwise,
# so the ESP32s on the hotspot would be refused without this file.
#
# Run (PowerShell, from the backend folder):
#   & "C:\Program Files\Mosquitto\mosquitto.exe" -c mosquitto.conf -v
#
# If port 1883 is blocked on Windows (WinError 10013), change it here AND in the firmware.

listener 1883 0.0.0.0
allow_anonymous true

# Demo only: no password. For anything beyond the demo, add a password_file.
