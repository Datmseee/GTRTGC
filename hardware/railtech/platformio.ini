; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Railtech train board: ESP32-S3 + PN532 RFID (SPI) + AS5600 wheel encoder (I2C),
; sending to the SPLRT backend over MQTT. See README.md.

[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200

; Every external library, with versions, so a fresh PC downloads them on first build.
; (WiFi, Wire, SPI and HTTPClient come with the Arduino-ESP32 framework.)
lib_deps =
	adafruit/Adafruit PN532@^1.3.4
	adafruit/Adafruit BusIO@^1.17.4
	knolleary/PubSubClient@^2.8

; Optional: second AS5600 encoder for LRV02 (off by default, see include/AppConfig.h)
; build_flags = -DUSE_ENCODER2=1
